apiVersion: v1
kind: Namespace
metadata:
  name: sdn-security
---
# ==============================================================================
# 1. Ryu SDN Controller Deployment & Service
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdn-controller
  namespace: sdn-security
  labels:
    app: sdn-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdn-controller
  template:
    metadata:
      labels:
        app: sdn-controller
    spec:
      containers:
      - name: controller
        image: sdn-controller:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6653
          name: openflow
        volumeMounts:
        - name: sdn-logs
          mountPath: /app/logs
      volumes:
      - name: sdn-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sdn-controller-service
  namespace: sdn-security
spec:
  selector:
    app: sdn-controller
  ports:
  - port: 6653
    targetPort: 6653
    name: openflow
  type: ClusterIP
---
# ==============================================================================
# 2. Flask Telemetry & Attack Orchestrator API
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdn-backend-api
  namespace: sdn-security
  labels:
    app: sdn-backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdn-backend-api
  template:
    metadata:
      labels:
        app: sdn-backend-api
    spec:
      containers:
      - name: api
        image: sdn-backend-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http-api
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: sdn-backend-service
  namespace: sdn-security
spec:
  selector:
    app: sdn-backend-api
  ports:
  - port: 5000
    targetPort: 5000
    name: http-api
  type: NodePort
---
# ==============================================================================
# 3. Next.js 3-Window Unified Dashboard
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdn-frontend-ui
  namespace: sdn-security
  labels:
    app: sdn-frontend-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdn-frontend-ui
  template:
    metadata:
      labels:
        app: sdn-frontend-ui
    spec:
      containers:
      - name: frontend
        image: sdn-frontend-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http-ui
        env:
        - name: NEXT_PUBLIC_API_BASE
          value: "http://localhost:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: sdn-frontend-service
  namespace: sdn-security
spec:
  selector:
    app: sdn-frontend-ui
  ports:
  - port: 3000
    targetPort: 3000
    name: http-ui
  type: LoadBalancer

